name: Pro Cert Radar v4.0

on:
  schedule:
    # Runs every 15 minutes for faster catch
    - cron: "*/15 * * * *"
  workflow_dispatch: # Manual trigger button

permissions:
  contents: write  # Allows saving state files back to repo

jobs:
  check-certs:
    runs-on: ubuntu-latest

    steps:
    - name: 🔄 Checkout code
      uses: actions/checkout@v4

    - name: 🐍 Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install feedparser requests beautifulsoup4

    - name: 🔍 Create state files if missing
      run: |
        if [ ! -f seen_links.json ]; then
          echo "{}" > seen_links.json
        fi
        if [ ! -f alert_log.json ]; then
          echo "[]" > alert_log.json
        fi
        if [ ! -f debug_log.json ]; then
          echo "[]" > debug_log.json
        fi
        if [ ! -f scan_stats.json ]; then
          echo "{}" > scan_stats.json
        fi

    - name: 🎯 Run Cert Radar v4.0
      env:
        EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        TO_EMAIL_ADDRESS: ${{ secrets.TO_EMAIL_ADDRESS }}
      run: python checker.py

    - name: 💾 Save state files to repo
      run: |
        git config user.name "Cert Radar Bot"
        git config user.email "bot@cert-radar.local"
        git add seen_links.json alert_log.json debug_log.json scan_stats.json 2>/dev/null || true
        git diff --staged --quiet || git commit -m "🤖 Update state files [skip ci]"
        git push || echo "Nothing to push"
